<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Maps Style UI</title>
<style>

@font-face {
  font-family: 'Google Sans';
    src: url('fonts/GoogleSans-MediumItalic.woff2') format('woff2'),
    url('fonts/GoogleSans-MediumItalic.woff') format('woff'),
    url('fonts/GoogleSans-MediumItalic.ttf') format('truetype');
    font-weight: 500;
    font-style: italic;
  }

@font-face {
  font-family: 'Google Sans';
    src: url('fonts/GoogleSans-Bold.woff2') format('woff2'),
    url('fonts/GoogleSans-Bold.woff') format('woff'),
    url('fonts/GoogleSans-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }

@font-face {
  font-family: 'Google Sans';
    src: url('fonts/GoogleSans-Italic.woff2') format('woff2'),
    url('fonts/GoogleSans-Italic.woff') format('woff'),
    url('fonts/GoogleSans-Italic.ttf') format('truetype');
    font-weight: normal;
    font-style: italic;
  }

@font-face {
  font-family: 'Google Sans';
    src: url('fonts/GoogleSans-Medium.woff2') format('woff2'),
    url('fonts/GoogleSans-Medium.woff') format('woff'),
    url('fonts/GoogleSans-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
  }

@font-face {
  font-family: 'Google Sans';
    src: url('fonts/GoogleSans-Regular.woff2') format('woff2'),
    url('fonts/GoogleSans-Regular.woff') format('woff'),
    url('fonts/GoogleSans-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

@font-face {
  font-family: 'Google Sans';
    src: url('GoogleSans-BoldItalic.woff2') format('woff2'),
    url('fonts/GoogleSans-BoldItalic.woff') format('woff'),
    url('fonts/GoogleSans-BoldItalic.ttf') format('truetype');
    font-weight: bold;
    font-style: italic;
  }

  body {
    font-family: 'Google Sans';
    background: #ffffff;
    padding: 20px;
  }

  .container {
    max-width: 500px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  h2 {
    margin-top: 0;
    font-size: 22px;
  }

  .share-buttons {
    display: flex;
    gap: 10px;
    margin: 10px 0 20px;
  }

  .share-btn {
    background: #007b8b;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
    position: relative;
  }
  .share-btn:hover {
    background: #148594;
  }

  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .info-row:hover {
    background: #ededed;
  }

  .info-text {
    flex: 1;
    margin-right: 10px;
    word-break: break-word;
  }

  .icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .icon-btn {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    position: relative;
  }

  /* Tooltip */
  .icon-btn[data-tooltip]:hover::after,
  .info-row[data-tooltip]:hover::after,
  .share-btn[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }
</style>
</head>
