html': Auto-rename HTML under archive/ to index.html

on:
  push:
    paths:
      - 'archive/**.html'

permissions:
  contents: write

jobs:
  rename-archive-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find and rename changed HTML files
        shell: bash
        run: |
          set -e

          git diff --name-only HEAD^ HEAD -- 'archive/*.html' 'archive/**/*.html' |
          while IFS= read -r file; do

            # Skip files that are already index.html
            if [[ "$(basename "$file")" == "index.html" ]]; then
              continue
            fi

            # Make sure the file still exists
            if [[ ! -f "$file" ]]; then
              continue
            fi

            dir=$(dirname "$file")
            target="$dir/index.html"

            echo "Renaming '$file' -> '$target'"

            mv "$file" "$target"

          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: rename uploaded html file to index.html"
          file_pattern: 'archive/**'
